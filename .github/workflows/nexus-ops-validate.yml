name: NEXUS ops validate

on:
  push:
    paths:
      - 'scripts/*.ps1'
      - 'scripts/*.sh'
      - '.devcontainer/*.sh'
      - '.github/workflows/nexus-ops-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files=Get-ChildItem scripts -Filter '*.ps1' -File
          foreach($f in $files){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors){ $errors | Format-List; throw "Parse failed: $($f.FullName)" }
            Write-Host "PARSE_OK $($f.Name)"
          }

      - name: Parse shell scripts
        shell: bash
        run: |
          set -e
          find scripts .devcontainer -maxdepth 1 -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
            echo "PARSE_OK $f"
          done
