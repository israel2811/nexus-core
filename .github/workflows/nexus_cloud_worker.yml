name: NEXUS Cloud Worker — On Demand

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Tarea segura: diagnostico, audit_repo, colab_prep'
        required: true
        default: 'diagnostico'
        type: choice
        options: [diagnostico, audit_repo, colab_prep]

permissions:
  contents: read

jobs:
  nexus-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare output
        run: mkdir -p nexus_outputs

      - name: Diagnostics
        if: ${{ inputs.task == 'diagnostico' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, shutil, time
          r={
            'timestamp':time.strftime('%Y-%m-%d %H:%M:%S UTC'),
            'os':platform.platform(),
            'python':platform.python_version(),
            'cpus':os.cpu_count(),
            'disk_free_gb':round(shutil.disk_usage('.').free/2**30,2),
          }
          print(json.dumps(r,indent=2))
          open('nexus_outputs/diagnostico_cloud.json','w').write(json.dumps(r,indent=2))
          PY

      - name: Repository audit
        if: ${{ inputs.task == 'audit_repo' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time
          root=pathlib.Path('.')
          files=[]
          for p in root.rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try:
              b=p.read_bytes()
            except OSError:
              continue
            files.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          r={'timestamp':time.strftime('%Y-%m-%d %H:%M:%S UTC'),'files':len(files),'total_bytes':sum(x['bytes'] for x in files)}
          pathlib.Path('nexus_outputs/repo_inventory.json').write_text(json.dumps({'summary':r,'files':files},indent=2))
          print(json.dumps(r,indent=2))
          PY

      - name: Prepare Colab handoff
        if: ${{ inputs.task == 'colab_prep' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, time
          r={
            'nexus_version':'3.1',
            'timestamp':time.strftime('%Y-%m-%d %H:%M:%S UTC'),
            'purpose':'large corpus / scientific compute handoff',
            'storage':'Google Drive or explicit upload; never assume persistence',
            'packages_core':['pandas','numpy','scipy'],
            'packages_optional_ml':['transformers','torch'],
            'ready':True,
          }
          pathlib.Path('nexus_outputs/colab_config.json').write_text(json.dumps(r,indent=2))
          print(json.dumps(r,indent=2))
          PY

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-outputs-${{ inputs.task }}-${{ github.run_id }}
          path: nexus_outputs/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo '## NEXUS Cloud Worker' >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: ${{ inputs.task }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: on-demand; no scheduled heavy dependencies' >> "$GITHUB_STEP_SUMMARY"
